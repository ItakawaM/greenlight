name: greenlight
services:
  postgres:
    image: postgres:18.4
    container_name: greenlight-postgres
    expose:
      - "5432"
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - greenlight-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    image: greenlight-redis:8.8
    container_name: greenlight-redis
    expose:
      - "6379"
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - greenlight-network

    healthcheck:
      # healthcheck to see if redis can write
      test: [ "CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli --raw incr healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  greenlight-network:

volumes:
  pgdata:
  redis-data:
