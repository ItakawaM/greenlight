services:
  postgres:
    image: postgres:18.4
    container_name: greenlight-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    image: greenlight-redis:8.8
    container_name: greenlight-redis
    expose:
      - ${REDIS_PORT:-6379}
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - greenlight-network

    healthcheck:
      # healthcheck to see if redis can write
      test: [ "CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli --raw incr healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  greenlight-network:

volumes:
  pgdata:
  redis-data:
